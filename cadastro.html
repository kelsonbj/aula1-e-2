<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro | Conforto</title>
    <link rel="stylesheet" href="css/login.css">
    <link rel="stylesheet" href="css/cadastro.css">
    <link rel="stylesheet" href="css/animacoes.css">
    <script src="js/script.js"></script>
</head>
<body>
    <header>
        <a class="voltar" href="index.html">&larr; Voltar</a>
        <h1>Conforto</h1>
    </header>
    <main>
        <div id="login-layout">
            <form id="form-cadastro" method="post">
                <section id="dados">
                    <h1>Criar conta</h1>

                    <div class="campo">
                        <label for="nome" class="so-leitor">Nome completo</label>
                        <input type="text" id="nome" name="nome" placeholder="Nome completo" autocomplete="name" minlength="3" required>
                    </div>

                    <div class="campo">
                        <label for="email" class="so-leitor">E-mail</label>
                        <input type="email" id="email" name="email" placeholder="Digite seu e-mail" autocomplete="email" required>
                    </div>

                    <div class="campo">
                        <label for="telefone" class="so-leitor">Telefone (opcional)</label>
                        <input type="tel" id="telefone" name="telefone" placeholder="Telefone (opcional)" autocomplete="tel" pattern="[0-9+ ]{9,15}" title="Use apenas números, espaços e +, entre 9 e 15 caracteres">
                    </div>

                    <div class="campo campo-senha">
                        <label for="senha" class="so-leitor">Senha</label>
                        <input type="password" id="senha" name="senha" placeholder="Crie uma senha" autocomplete="new-password" minlength="8" required>
                        <button type="button" class="mostrar-senha" data-alvo="senha" aria-pressed="false" aria-label="Mostrar senha">Mostrar</button>
                    </div>

                    <div class="campo campo-senha">
                        <label for="confirmar-senha" class="so-leitor">Confirmar senha</label>
                        <input type="password" id="confirmar-senha" name="confirmar-senha" placeholder="Repita a senha" autocomplete="new-password" minlength="8" required>
                        <button type="button" class="mostrar-senha" data-alvo="confirmar-senha" aria-pressed="false" aria-label="Mostrar confirmação da senha">Mostrar</button>
                    </div>

                    <p class="dica">A senha deve ter pelo menos 8 caracteres.</p>
                    <p id="mensagem" role="alert" aria-live="polite"></p>

                    <div class="termos">
                        <label><input type="checkbox" name="termos" required> Aceito os termos de uso da Conforto</label>
                    </div>

                    <button type="submit" class="botao-entrar">Criar conta</button>

                    <p class="cadastrar">Já tem conta? <a href="login.html">Faça login</a></p>
                </section>
            </form>
        </div>
    </main>
    <footer>
        <div>
            <p>&copy; 2026 Projeto Conforto. Todos os direitos reservados.</p>
            <p>Desenvolvido por Kelson Bajé (KelsonBj)</p>
        </div>
    </footer>

    <script src="js/cadastro.js"></script>
</body>
</html>
