<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <header>
        <button><a href="index.html">voltar</a></button>
        <h1>Conforto</h1>
    </header>
    <main>
        <form action="">
            <section id="carrossel">
                <!--carrosel-->
                <div class="carrossel">
                    <article class="carrossel-img">
                        <img src="img/carrossel.png" alt="">
                    </article>
                    <article class="carrossel-info">
                        <p>conteudo</p>
                        <p>$30</p>
                    </article>
                </div>
                <div class="carrossel">
                    <article class="carrossel-img">
                        <img src="img/carrossel2.png" alt="">
                    </article>
                    <article class="carrossel-info">
                        <p>conteudo</p>
                        <p>$30</p>
                    </article>
                </div>
                <div class="carrossel">
                    <article class="carrossel-img">
                        <img src="img/carrossel3.png" alt="">
                    </article>
                    <article class="carrossel-info">
                        <p>conteudo</p>
                        <p>$30</p>
                    </article>
                </div>
            </section>
            <section id="dados">
                <h1>Login</h1>
                <div class="dados" id="texto">
                    <input type="text" placeholder="Digite Seu E-mail" required>
                </div>
                <div class="dados" id="senha">
                    <input type="password" placeholder="Digite Sua Senha" required>
                </div>
                <div class="dados" id="check">
                    <input type="checkbox">
                    <p>Esqueceu a Senha?</p>
                </div>
                <button>entrar</button>

            </section>
        </form>
    </main>
    <footer>
        <div>
            <p>&copy; 2026 Projecto Conforto. Todos os direitos reservados.</p>
            <p>Desenvolvido Por Kelson Bajé</p>
            <p>Desenvolvedor KelsonBj</p>
        </div>
    </footer>
</body>
</html>
